# Nginx 配置（域名硬编码为 chammmsblog.site；更换域名时全文替换即可）
# 注意：$host、$request_uri 等 nginx 内置变量不在容器环境变量中，不会被 envsubst 影响

server {
    listen 80;
    server_name chammmsblog.site;

    # Let's Encrypt ACME HTTP-01 挑战
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name chammmsblog.site;

    ssl_certificate     /etc/letsencrypt/live/chammmsblog.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chammmsblog.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    # 去掉末尾斜杠访问时补一个
    location = /texas-holdem {
        return 301 /texas-holdem/;
    }

    # Socket.IO（WebSocket 长连接，必须放行 Upgrade；后端原生监听带前缀路径，原样透传）
    location /texas-holdem/socket.io {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 应用本体（保留 /texas-holdem/ 前缀透传到 Node，与本地行为一致）
    location /texas-holdem/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 域名根路径暂未分配其他站点，先 404
    location / {
        return 404;
    }
}
