services:
  app:
    build: .
    image: texas-holdem:latest
    container_name: texas-holdem
    restart: unless-stopped
    ports:
      # 仅绑定本机回环：供健康检查与调试；对外流量一律走 nginx (80/443)
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL:-https://chammmsblog.site/texas-holdem}
      HISTORY_DIR: /app/data/history
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/anthropic}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
    volumes:
      # 对局记录持久化：容器重建/重新部署后历史仍保留
      - texas_history:/app/data/history

  nginx:
    image: nginx:1.27-alpine
    container_name: texas-holdem-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 静态配置直接挂进 conf.d（不走 envsubst 模板：自定义 command 以 sh 开头时
      # 官方 entrypoint 会跳过模板渲染，导致配置不生效）
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - app
    # 每 6h reload 一次，让 certbot 续期后的新证书生效
    command: >
      sh -c "while :; do sleep 6h; nginx -s reload; done &
             exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: texas-holdem-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # 每 12h 检查一次续期（证书 90 天有效，剩余 30 天内才会真正续）
    entrypoint: >
      sh -c "trap 'exit 0' TERM;
             while :; do certbot renew --quiet; sleep 12h & wait $$!; done"

volumes:
  letsencrypt:
  certbot-webroot:
  texas_history:
