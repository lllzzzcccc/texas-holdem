services:
  app:
    build: .
    image: texas-holdem:latest
    container_name: texas-holdem
    restart: unless-stopped
    ports:
      # 宿主机 HTTP 端口（默认 80）→ 容器 3000
      - "${HTTP_PORT:-80}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
