services:
  app:
    build: .
    image: texas-holdem:latest
    container_name: texas-holdem
    restart: unless-stopped
    ports:
      # 仅绑定本机回环：供健康检查与调试；对外流量一律走 nginx (80/443)
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL:-https://chammmsblog.site/texas-holdem}

  nginx:
    image: nginx:1.27-alpine
    container_name: texas-holdem-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 供 nginx.conf.template 的 envsubst 使用
      DOMAIN: ${DOMAIN:-chammmsblog.site}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - app
    # 每 6h reload 一次，让 certbot 续期后的新证书生效
    command: >
      sh -c "while :; do sleep 6h; nginx -s reload; done &
             exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    container_name: texas-holdem-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # 每 12h 检查一次续期（证书 90 天有效，剩余 30 天内才会真正续）
    entrypoint: >
      sh -c "trap 'exit 0' TERM;
             while :; do certbot renew --quiet; sleep 12h & wait $$!; done"

volumes:
  letsencrypt:
  certbot-webroot:
